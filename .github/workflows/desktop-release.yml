name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build-desktop -G Ninja \
            -DBC2_BUILD_SIMULATOR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_GENERATOR=TGZ

      - name: Build
        run: cmake --build build-desktop --parallel

      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure

      - name: Package
        run: cmake --build build-desktop --target package

      - name: Show diagnostics on failure
        if: failure()
        run: |
          find build-desktop -maxdepth 3 -type f \( -name "CMakeError.log" -o -name "CMakeOutput.log" -o -name "*.log" \) -print -exec tail -n 120 {} \; || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bc2-cold-wallet-Linux
          path: build-desktop/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Enable MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install OpenSSL with vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
              throw "VCPKG_INSTALLATION_ROOT is not available on this runner"
          }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
              throw "vcpkg CMake toolchain was not found at $toolchain"
          }

          cmake -S . -B build-desktop `
            -G Ninja `
            -DBC2_BUILD_SIMULATOR=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCPACK_GENERATOR=ZIP

      - name: Build
        run: cmake --build build-desktop --parallel

      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure

      - name: Package
        run: cmake --build build-desktop --target package

      - name: Show diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build-desktop -Recurse -Include *.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Tail 120
            }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bc2-cold-wallet-Windows
          path: build-desktop/*.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install macOS dependencies
        run: brew install ninja openssl@3

      - name: Export OpenSSL paths
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build-desktop -G Ninja \
            -DBC2_BUILD_SIMULATOR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCPACK_GENERATOR=DragNDrop

      - name: Build
        run: cmake --build build-desktop --parallel

      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure

      - name: Package
        run: cmake --build build-desktop --target package

      - name: Show diagnostics on failure
        if: failure()
        run: |
          find build-desktop -maxdepth 4 -type f \( -name "CMakeError.log" -o -name "CMakeOutput.log" -o -name "*.log" \) -print -exec tail -n 120 {} \; || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bc2-cold-wallet-macOS
          path: build-desktop/*.dmg
          if-no-files-found: error
